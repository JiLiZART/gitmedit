[package]
name = "gitmedit"
version = "1.0.0"
edition = "2024"
description = "Fast, distraction-free git editor with nano-style shortcuts and context-aware modes for commits, merges, and interactive rebase"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jilizart/gitmedit"
keywords = ["git", "editor", "tui", "commit", "rebase"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.30"
ratatui-textarea = { version = "0.8", features = ["crossterm"] }
crossterm = "0.29"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
arboard = "3.6"

[dev-dependencies]
tempfile = "3"
portable-pty = "0.9.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
